<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Introduction to Arithmetic Operations</title>
</head>
<body>

  <div class="container">
    <h1 class="container-title">Introduction to Arithmetic Operations</h1>

    <div class="operations">
        <ul>
          <li>1 &plus; 1 &equals; 2</li>
          <li>2 &plus; 2 &equals; 4</li>
          <li>3 &plus; 3 &equals; 6</li>
          <li>4 &plus; 4 &equals; 8</li>
          <li>5 &plus; 5 &equals; 10</li> 
          <li>6 &plus; 6 &equals; 12</li>
          <li>7 &plus; 7 &equals; 14</li>
          <li>8 &plus; 8 &equals; 16</li>
          <li>9 &plus; 9 &equals; 18</li>
          <li>10 &plus; 10 &equals; 20</li>
        </ul>
      </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
