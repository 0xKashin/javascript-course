<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Introduction of a Variable Constant</title>
</head>
<body>

  <div class="age-converter">
    <h1 class="converter-title">Age Converter System From the Past</h1>
    <p class="description"><small>Since: 2026</small></p>
    <form class="info">
      <label for="currentYear">Current Year</label>
      <input type="text" id="currentYear">

      <label for="pastYear">Source Year</label>
      <input type="text" id="pastYear">

      <label for="ageConvert">Age</label>
      <input type="text" id="ageConvert">

      <button type="button" id="submitBtn">Submit</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
